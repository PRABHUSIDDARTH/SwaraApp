# Wake-word "hey swara" data pipeline. Every audio source must pass the licence gate
# (CC0-1.0, CC-BY-3.0, CC-BY-4.0 or own); see wakeword/data/manifest.py.
sample_rate: 16000
window_samples: 16000        # 1.0 s detector window
data_root: data              # git-ignored

synth:
  # Kokoro-82M voices; the language code is the first letter (a = US, b = UK English).
  # Every English voice Kokoro-82M ships (American + British, female + male).
  voices:
    - af_alloy
    - af_aoede
    - af_bella
    - af_heart
    - af_jessica
    - af_kore
    - af_nicole
    - af_nova
    - af_river
    - af_sarah
    - af_sky
    - am_adam
    - am_echo
    - am_eric
    - am_fenrir
    - am_liam
    - am_michael
    - am_onyx
    - am_puck
    - am_santa
    - bf_alice
    - bf_emma
    - bf_isabella
    - bf_lily
    - bm_daniel
    - bm_fable
    - bm_george
    - bm_lewis
  positives: ["hey swara"]
  near_misses: ["hey sara", "hey siri", "swaram", "play some", "hey there", "hey sarah", "sweater"]
  speeds: [0.8, 0.9, 1.0, 1.1, 1.25]
  semitones: [-2, -1, 0, 1, 2]
  variants_per_voice_text: 6   # random (speed, semitone) combinations per voice and text
  seed: 0

noise:                       # synthetic room-noise backgrounds (own)
  kinds: [white, pink, brown, hum, fan]
  clips_per_kind: 4
  seconds: 5.0
  seed: 0

mix:
  snr_db: [-5.0, 15.0]
  cheap_mic_p: 0.3
  cheap_mic_band_hz: [300, 3400]
  reverb_p: 0.5
  gain_db: [-6.0, 0.0]

fetch:
  # Korokae v2 audited manifest (columns incl. role, licence); used for backgrounds when present.
  korokae_manifest_csv: ../korokae_v2/data/accompaniment/manifest.csv
  librispeech:
    licence: "CC BY 4.0"
    licence_url: https://creativecommons.org/licenses/by/4.0/
    subsets:
      train-clean-100: {url: https://www.openslr.org/resources/12/train-clean-100.tar.gz, split: train}
      dev-clean: {url: https://www.openslr.org/resources/12/dev-clean.tar.gz, split: val}
      test-clean: {url: https://www.openslr.org/resources/12/test-clean.tar.gz, split: test}
    max_files_per_subset: 0    # 0 = all
  ccmixter:
    query_url: "http://ccmixter.org/api/query?f=json&lic=by&tags=instrumental&limit=200"
    max_files: 200

train:
  # Data roots whose manifest.csv files are merged (absent roots are skipped) and validated together.
  roots: [data/external, data/synth, data/recorded, data/noise]
  batch_size: 96               # one third positives
  epochs: 40
  steps_per_epoch: 200
  lr: 0.002
  patience: 8                  # early stop on val loss
  val_examples: 600
  hard_neg_candidates: 4000    # windows scanned per epoch
  hard_neg_per_epoch: 256      # top-scoring ones kept
  hard_neg_max: 2048           # pool cap (oldest dropped)
  hard_neg_frac: 0.25          # share of each batch's negatives drawn from the hard pool
  seed: 0
  cache_bytes: 2000000000      # LRU cap on cached decoded audio (bytes)
  long_clip_seconds: 10.0      # longer files are randomly cropped on load, never cached whole

gate:
  min_negative_hours: 10.0     # held-out test negative stream must be at least this long, else the gate fails
