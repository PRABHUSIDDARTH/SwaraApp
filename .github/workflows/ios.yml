name: iOS CI

on:
  push:
    paths:
      - 'ios/**'
      - 'android/app/src/main/assets/models/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'android/app/src/main/assets/models/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  core-linux:
    name: SwaraCore tests (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ios/SwaraCore
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: '6.0'
      - name: Run tests
        run: swift test

  app-macos:
    name: Build app (macOS)
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -i iphone | head -20

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Full compile of the app for the simulator. Output is kept as an artifact.
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Swara.xcodeproj -scheme Swara \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build-sim.log

      # Unit tests on a real simulator device (first available iPhone).
      - name: Run unit tests on simulator
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available | grep -i "iphone" | grep -v unavailable | head -1 | sed -E 's/^ *(.+) \(([0-9A-F-]{36})\).*/\1/')
          echo "Simulator: $DEVICE"
          xcodebuild test \
            -project Swara.xcodeproj -scheme Swara \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test-sim.log

      # Unsigned device build packaged as .ipa. Install it with a signing tool
      # (for example Sideloadly or AltStore with an Apple ID) or sign it in Xcode.
      - name: Build unsigned device .ipa
        run: |
          set -o pipefail
          xcodebuild build \
            -project Swara.xcodeproj -scheme Swara \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build-device.log
          APP=$(find build/device/Build/Products/Release-iphoneos -maxdepth 1 -name 'Swara.app' | head -1)
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          cd dist && zip -qr Swara-unsigned.ipa Payload && cd ..
          ls -la dist

      # GitHub only exposes job logs to repo admins. Surface compiler errors as
      # annotations so they are readable on the run page.
      - name: Annotate compiler errors
        if: failure()
        run: |
          for f in ios/build-sim.log ios/test-sim.log ios/build-device.log; do
            [ -f "$f" ] || continue
            sed 's/\x1b\[[0-9;]*m//g' "$f" | grep -E ': error:' | head -40 | while IFS= read -r line; do
              echo "::error title=$(basename $f)::${line//::/ }"
            done
          done

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: ios/*.log
          if-no-files-found: warn

      - name: Upload unsigned iPhone app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Swara-unsigned-ipa
          path: ios/dist/Swara-unsigned.ipa
          if-no-files-found: error
