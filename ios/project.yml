# XcodeGen spec. Generate the Xcode project on a Mac with:
#   brew install xcodegen && cd ios && xcodegen generate
# The generated Swara.xcodeproj is git-ignored; this file is the source of truth.
name: Swara
options:
  bundleIdPrefix: com.psthetech
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"   # Swift 5 language mode (Xcode 15+/Swift 5.9+ compiler)
    MARKETING_VERSION: "2.1"
    CURRENT_PROJECT_VERSION: "3"
    DEVELOPMENT_TEAM: ""   # set your Apple team ID (or pick it in Xcode > Signing)
packages:
  SwaraCore:
    path: SwaraCore
targets:
  Swara:
    type: application
    platform: iOS
    sources:
      - path: Swara
      # Korokae model is shared with Android and bundled by reference (no copy).
      - path: ../android/app/src/main/assets/models/korokae_v1.bin
        buildPhase: resources
    dependencies:
      - package: SwaraCore
    info:
      path: Swara/Info.plist
      properties:
        CFBundleDisplayName: Swara
        UILaunchScreen:
          UIColorName: AccentColor
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSPhotoLibraryUsageDescription: Swara uses photos you choose as custom playlist artwork.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.psthetech.swara
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: false
  SwaraTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SwaraTests]
    dependencies:
      - target: Swara
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.psthetech.swara.tests
schemes:
  Swara:
    build:
      targets:
        Swara: all
        SwaraTests: [test]
    test:
      targets: [SwaraTests]
