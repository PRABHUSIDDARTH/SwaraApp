import com.android.build.api.artifact.SingleArtifact
import javax.xml.parsers.DocumentBuilderFactory

plugins {
    alias(libs.plugins.android.application)
}

// Release signing is read from keystore.properties (never committed), e.g.:
//   storeFile=/path/to/swara.jks
//   storePassword=...
//   keyAlias=swara
//   keyPassword=...
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'com.psthetech.swara'
    compileSdk 36

    defaultConfig {
        applicationId "com.psthetech.swara"
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName "2.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Export Room schemas so migrations can be reviewed and verified.
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas")
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    // Korokae v2: ONNX models are memory-mapped/copied as-is; never compress them in the APK
    androidResources {
        noCompress 'onnx'
    }
}

// ===== Manifest privacy check =====
// Libraries can merge permissions and startup components into the app without any change to our
// own manifest (ONNX Runtime added INTERNET and a telemetry provider this way). This checks the
// final merged manifest of every variant. A new permission fails the build until it is reviewed
// and added here.
def allowedPermissions = [
        'android.permission.READ_MEDIA_AUDIO',
        'android.permission.READ_EXTERNAL_STORAGE',
        'android.permission.FOREGROUND_SERVICE',
        'android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK',
        'android.permission.POST_NOTIFICATIONS',
        'android.permission.RECORD_AUDIO',
        'android.permission.WAKE_LOCK',
        'android.permission.RECEIVE_BOOT_COMPLETED', // WorkManager
]
// Class-name prefixes that must never be registered as app components.
def bannedComponentPrefixes = ['ai.onnxruntime.']

abstract class VerifyManifestPrivacyTask extends DefaultTask {
    @InputFile
    @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getMergedManifest()

    @Input
    abstract SetProperty<String> getAllowedPermissions()

    @Input
    abstract SetProperty<String> getBannedComponentPrefixes()

    @OutputFile
    abstract RegularFileProperty getReport()

    @TaskAction
    void verify() {
        def android = 'http://schemas.android.com/apk/res/android'
        def factory = DocumentBuilderFactory.newInstance()
        factory.namespaceAware = true
        def root = factory.newDocumentBuilder().parse(mergedManifest.get().asFile).documentElement
        // androidx.core declares and uses one permission named after the application ID
        def ownPermission = root.getAttribute('package') + '.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION'
        def problems = []
        def all = root.getElementsByTagName('*')
        for (int i = 0; i < all.length; i++) {
            def element = all.item(i)
            def name = element.getAttributeNS(android, 'name')
            if (element.tagName.startsWith('uses-permission')) {
                if (name != ownPermission && !allowedPermissions.get().contains(name)) {
                    problems << "unapproved permission: ${name}".toString()
                }
            } else if (element.tagName in ['provider', 'service', 'receiver', 'activity', 'meta-data']) {
                if (bannedComponentPrefixes.get().any { name.startsWith(it) }) {
                    problems << "banned component: <${element.tagName}> ${name}".toString()
                }
            }
        }
        if (!problems.isEmpty()) {
            throw new GradleException("Merged manifest privacy check failed for " +
                    "${mergedManifest.get().asFile}:\n  - " + problems.join('\n  - '))
        }
        report.get().asFile.text = 'ok\n'
    }
}

def verifyAllManifests = tasks.register('verifyMergedManifests') {
    group = 'verification'
    description = 'Checks the merged manifest of every variant for unapproved permissions and components.'
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def suffix = variant.name.capitalize()
        def verify = tasks.register("verify${suffix}MergedManifest", VerifyManifestPrivacyTask) {
            mergedManifest.set(variant.artifacts.get(SingleArtifact.MERGED_MANIFEST.INSTANCE))
            getAllowedPermissions().set(allowedPermissions)
            getBannedComponentPrefixes().set(bannedComponentPrefixes)
            report.set(layout.buildDirectory.file("reports/manifest-privacy/${variant.name}.txt"))
        }
        verifyAllManifests.configure { dependsOn(verify) }
        // No APK or app bundle can be produced without passing
        def packaging = ["assemble${suffix}", "package${suffix}", "bundle${suffix}",
                         "package${suffix}Bundle"].collect { it.toString() }
        tasks.matching { packaging.contains(it.name) }.configureEach { dependsOn(verify) }
    }
}

tasks.matching { it.name == 'check' }.configureEach { dependsOn(verifyAllManifests) }

dependencies {
    // Core UI
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.recyclerview
    implementation libs.viewpager2
    implementation libs.core.splashscreen

    // Lifecycle — ViewModel + LiveData (pure Java, no KTX)
    implementation libs.lifecycle.viewmodel
    implementation libs.lifecycle.livedata
    implementation libs.lifecycle.runtime
    implementation libs.lifecycle.common

    // Navigation Component (pure Java)
    implementation libs.navigation.fragment
    implementation libs.navigation.ui

    // Korokae v2: ONNX Runtime (MIT) executes our own vocal-removal model on device
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.31.1'

    // Media3 / ExoPlayer
    implementation libs.media3.exoplayer
    implementation libs.media3.session
    implementation libs.media3.ui

    // Glide — image loading and artwork caching
    implementation libs.glide
    annotationProcessor libs.glide.compiler

    // Room — local database
    implementation libs.room.runtime
    implementation libs.work.runtime
    annotationProcessor libs.room.compiler

    // Testing
    testImplementation libs.junit
    testImplementation libs.mockito.core
    // Real org.json for JVM tests (Android's is a stub off-device); not shipped in the app
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.mockito:mockito-core:4.11.0'
    testImplementation 'org.mockito:mockito-inline:4.11.0'
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation "androidx.room:room-testing:2.6.1"
}